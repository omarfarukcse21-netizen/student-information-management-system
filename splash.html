<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      animation: appear 0.5s ease-out both;
    }

    /* main.js বন্ধ করার আগে এই ক্লাস বসায়, তখন ধীরে মিলিয়ে যায় */
    body.closing { animation: disappear 0.35s ease-in both; }

    .card {
      position: relative;
      width: 500px;
      height: 320px;
      border-radius: 26px;
      overflow: hidden;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 88% 10%, rgba(251, 191, 36, 0.30), transparent 40%),
        radial-gradient(circle at 8% 100%, rgba(244, 114, 182, 0.32), transparent 45%),
        linear-gradient(145deg, #1d4ed8 0%, #4f46e5 60%, #7c3aed 100%);
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.55);
    }

    /* খাতার পাতার মতো হালকা বিন্দু */
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.16) 1.3px, transparent 1.6px);
      background-size: 26px 26px;
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* লোগো ও তার চারপাশের স্পন্দিত বৃত্ত */
    .logo-wrap {
      position: relative;
      width: 104px;
      height: 104px;
    }

    .logo-wrap::before,
    .logo-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.55);
      animation: pulse 2.4s ease-out infinite;
    }

    .logo-wrap::after { animation-delay: 1.2s; }

    .logo {
      position: relative;
      z-index: 1;
      width: 104px;
      height: 104px;
      filter: drop-shadow(0 10px 16px rgba(15, 23, 42, 0.45));
      animation: bob 2.2s ease-in-out infinite;
    }

    h1 {
      margin-top: 22px;
      font-size: 25px;
      letter-spacing: 0.3px;
      animation: rise 0.8s 0.2s ease-out both;
    }

    .status {
      margin-top: 6px;
      min-height: 18px;
      font-size: 13px;
      opacity: 0.92;
      animation: rise 0.8s 0.4s ease-out both;
    }

    /* লোডিং বার */
    .bar {
      width: 300px;
      height: 7px;
      margin-top: 24px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.22);
      overflow: hidden;
      animation: rise 0.8s 0.5s ease-out both;
    }

    .bar span {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 7px;
      background: linear-gradient(90deg, #fde68a, #fbbf24, #fde68a);
      background-size: 200% 100%;
      animation: fill 2.4s cubic-bezier(0.4, 0.1, 0.2, 1) 0.4s forwards,
                 shimmer 1.2s linear infinite;
    }

    .version {
      position: absolute;
      bottom: 14px;
      z-index: 2;
      font-size: 11px;
      opacity: 0.6;
      letter-spacing: 0.5px;
    }

    /* ভাসমান ছোট সাজসজ্জা */
    .dot {
      position: absolute;
      z-index: 1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
      animation: drift 6s ease-in-out infinite;
    }
    .d1 { width: 16px; height: 16px; left: 12%; top: 18%; }
    .d2 { width: 10px; height: 10px; right: 16%; top: 30%; animation-delay: -2s; background: rgba(251, 191, 36, 0.7); }
    .d3 { width: 22px; height: 22px; right: 10%; bottom: 20%; animation-delay: -4s; }
    .d4 { width: 12px; height: 12px; left: 18%; bottom: 24%; animation-delay: -1s; background: rgba(244, 114, 182, 0.7); }

    @keyframes appear {
      from { opacity: 0; transform: scale(0.94); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes disappear {
      from { opacity: 1; transform: scale(1); }
      to   { opacity: 0; transform: scale(1.04); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-9px); }
    }
    @keyframes pulse {
      0%   { transform: scale(1);   opacity: 0.7; }
      100% { transform: scale(1.7); opacity: 0; }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fill {
      from { width: 0; }
      to   { width: 100%; }
    }
    @keyframes shimmer {
      from { background-position: 0 0; }
      to   { background-position: 200% 0; }
    }
    @keyframes drift {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-14px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo, .logo-wrap::before, .logo-wrap::after, .dot { animation: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="dot d1"></span>
    <span class="dot d2"></span>
    <span class="dot d3"></span>
    <span class="dot d4"></span>

    <div class="content">
      <div class="logo-wrap">
        <img class="logo" src="icon.png" alt="Logo">
      </div>
      <h1>Student Management System</h1>
      <p class="status" id="status">Starting up...</p>
      <div class="bar"><span></span></div>
    </div>

    <span class="version">v1.0</span>
  </div>

  <script>
    // নিচের লেখাগুলো একটার পর একটা বদলাবে
    const messages = [
      'Starting up...',
      'Loading student records...',
      'Preparing your dashboard...',
      'Almost ready...'
    ];
    let i = 0;
    const status = document.getElementById('status');
    setInterval(function () {
      i = Math.min(i + 1, messages.length - 1);
      status.textContent = messages[i];
    }, 700);
  </script>
</body>
</html>
