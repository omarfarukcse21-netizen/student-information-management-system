<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Student Management System</h1>
    <p>Manage student records easily and quickly</p>
  </header>

  <main>

    <!-- ফর্ম: নতুন স্টুডেন্ট যোগ / এডিট -->
    <section class="card">
      <h2 id="form-title">Add New Student</h2>

      <form id="student-form">
        <div class="grid">
          <div class="field">
            <label for="studentId">Student ID *</label>
            <input type="text" id="studentId" placeholder="e.g. 2201001">
          </div>

          <div class="field">
            <label for="studentName">Full Name *</label>
            <input type="text" id="studentName" placeholder="e.g. Rahim Uddin">
          </div>

          <div class="field">
            <label for="department">Department *</label>
            <select id="department"></select>
          </div>

          <div class="field">
            <label for="semester">Semester *</label>
            <select id="semester"></select>
          </div>

          <div class="field">
            <label for="phone">Phone</label>
            <input type="text" id="phone" placeholder="e.g. 01712345678">
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="text" id="email" placeholder="e.g. rahim@gmail.com">
          </div>

          <div class="field">
            <label for="photo">Photo</label>
            <input type="file" id="photo" accept="image/*">
            <img id="photo-preview" class="photo-preview hidden" alt="Preview">
          </div>
        </div>

        <p id="error-msg" class="error"></p>

        <div class="buttons">
          <button type="submit" id="save-btn" class="btn primary">Save Student</button>
          <button type="button" id="cancel-btn" class="btn secondary hidden">Cancel Edit</button>
        </div>
      </form>
    </section>

    <!-- তালিকা ও সার্চ -->
    <section class="card">
      <div class="list-header">
        <h2>Student List <span id="count" class="badge">0</span></h2>

        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search by ID or Name...">
          <select id="filterDept"></select>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Photo</th>
              <th>ID</th>
              <th>Name</th>
              <th>Department</th>
              <th>Semester</th>
              <th>Phone</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="student-table-body"></tbody>
        </table>
      </div>

      <p id="empty-msg" class="empty hidden">No students found.</p>
    </section>

  </main>

  <!-- ডিটেইলস দেখানোর পপ-আপ -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h2>Student Details</h2>
      <div id="modal-body"></div>
      <button id="modal-close" class="btn primary">Close</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
